<div class="container my-5">
  <div class="row justify-content-center">
    
    <div class="col-md-5 col-lg-4">
      <div class="card shadow border-0 text-center custom-card">

        <div class="card-body p-4">
          <div class="icon-box mb-3">
            <i class="bi bi-key fs-2 text-white"></i>
          </div>

          <h5 class="fw-semibold">Change Password</h5>

          <p class="text-muted small">
            Update your account password regularly to keep your profile secure.
          </p>

          <button class="btn btn-warning btn-sm px-4 mt-2"
                  (click)="openChangePassword(changePasswordModal)">
            <i class="bi bi-pencil me-1"></i> Change
          </button>
        </div>

      </div>
    </div>

  </div>
</div>

<!-- Modal -->
<ng-template #changePasswordModal let-modal>
  <div class="modal-header">
    <h5 class="modal-title">🔐 Change Password</h5>
    <button type="button" class="btn-close"
            (click)="modal.dismiss()"></button>
  </div>

  <div class="modal-body">
    <app-chagepasswordchild></app-chagepasswordchild>
  </div>
</ng-template>
