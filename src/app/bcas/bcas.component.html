<div class="audit-page">

  <!-- ── PAGE HEADER ─────────────────────────────────────────────── -->
  <div class="page-header-card">
    <div class="d-flex align-items-center gap-3">
      <div class="page-icon-box">
        <i class="fa fa-shield-alt"></i>
      </div>
      <div>
        <h2 class="page-title">BCAS, Internal, ICAO Audit Tracking</h2>
        <p class="page-subtitle">Manage BCAS, Internal &amp; ICAO audit records for CISF airport units</p>
      </div>
    </div>
    <a href="/dashboard" class="back-btn">
      <i class="fa-solid fa-arrow-left"></i> Dashboard
    </a>
  </div>

  <!-- ── AUDIT TYPE TABS ─────────────────────────────────────────── -->
  <div class="audit-tabs-wrapper">
    <button class="audit-tab bcas-tab" [class.active]="activeTab === 'BCAS'" (click)="setTab('BCAS')">
      <i class="fa fa-shield-alt"></i> BCAS
    </button>
    <button class="audit-tab internal-tab" [class.active]="activeTab === 'Internal'" (click)="setTab('Internal')">
      <i class="fa fa-building"></i> Internal
    </button>
    <button class="audit-tab icao-tab" [class.active]="activeTab === 'ICAO'" (click)="setTab('ICAO')">
      <i class="fa fa-globe"></i> ICAO
    </button>
  </div>

  <!-- ── BCAS TAB ────────────────────────────────────────────────── -->
  <app-bcas-bcas *ngIf="activeTab === 'BCAS'"></app-bcas-bcas>

  <!-- ── INTERNAL TAB ───────────────────────────────────────────── -->
  <app-bcas-internal *ngIf="activeTab === 'Internal'"></app-bcas-internal>

  <!-- ── ICAO TAB ───────────────────────────────────────────────── -->
  <app-bcas-icao *ngIf="activeTab === 'ICAO'"></app-bcas-icao>

</div>
