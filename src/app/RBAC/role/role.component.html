<div>
  <!-- Form -->
  <div *ngIf="errorStatus" class="error-msg">{{ errorMsg }}</div> 
  <div *ngIf="successStatus" class="success-msg">{{ successMsg }}</div>
   <form [formGroup]="roleDetailsForm" (ngSubmit)="addRole(roleDetailsForm.value)" class="was-validated">
    <div class="form-group">
      <label>Role Name</label>
      <input type="text" formControlName="roleName" name="roleName" />
      <span class="warning-msg">E.g. Admin, Sector, Zone,Unit ...</span>
    </div>
   
    <div class="form-group">
      <label>Description</label>
      <textarea formControlName="remarks" name="remarks"></textarea>
    </div>
    

    <!-- Buttons -->
    <div class="d-flex justify-content-center">
      <button type="submit" class="btn btn-primary me-4" [disabled]="roleDetailsForm.invalid">{{btnName}}</button>
      <button type="reset" class="btn btn-warning" onclick="roleReset()">Reset</button>
    </div>
  </form>
</div>
