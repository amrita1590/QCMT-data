<div class="mt-5">
    <div class="row mb-3">
      <div class="col-md-9">
        <input type="text" class="form-control" name="search" placeholder="Search..." [(ngModel)]="searchText" />
      </div>
      <div class="col-md-3">
        <select class="form-select" name="pageSize" [(ngModel)]="pageSize" (change)="page = 1">
          <option *ngFor="let size of pageSizeOptions" [value]="size">{{ size }} per page</option>
        </select>
      </div>
    </div>
  
    <table class="table table-bordered table-hover">
      <thead class="table-dark">
        <tr>
          <th>Sl No</th>
          <th>Role Name</th>
          <th>Additional Details</th>
          <th>Edit</th>
          <th>Delete</th>
        </tr>
      </thead>
      <tbody>
        <tr 
          *ngFor="let role of filteredData | slice: (page - 1) * pageSize : page * pageSize; let i = index;">
          <td>{{ (page - 1) * pageSize + i + 1 }}</td> <!-- Serial number -->
          <td>{{ role.roleName }}</td>
          <td>{{ role.remarks }}</td>
          <td>
            <button type="button" (click)="editRoleDetails(role.id, addRole)"  class="btn btn-info btn-sm">
              <i class="fal bi-pencil"></i> Edit
            </button>
          </td>
          <td>
            <button type="button" class="btn btn-danger btn-sm"  (click)="openModal(deleteModal, role.id, role.roleName)">
              <i class="fal bi-trash-fill"></i> Delete
            </button>
          </td>        
        </tr>
      </tbody>
    </table>

    <ng-template #deleteModal let-modal>
      <div class="modal-header">
        <h5 class="modal-title">Confirm Deletion</h5>
        <button type="button" class="btn-close" aria-label="Close" (click)="modal.dismiss()"></button>
      </div>
      <div class="modal-body">
        Are you sure you want to delete <strong>{{ roleName }} </strong>?
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-warning" (click)="modal.dismiss()">Cancel</button>
        <button type="button" class="btn btn-danger" (click)="confirmDelete(roleId, 'deleteModal')">Yes, Delete</button>
      </div>
    </ng-template>
    
    <ng-template #addRole let-modal>
      <div class="modal-header">
          <h5 class="modal-title">🔐 Add Role</h5>
          <button type="button" class="btn-close" aria-label="Close" (click)="closeModel('addRole')"></button>
      </div>
      <div class="modal-body">
          <app-role></app-role>
      </div>
    </ng-template>
    <!-- Pagination -->
    <nav>
      <ul class="pagination justify-content-center">
        <li class="page-item" [class.disabled]="page === 1">
          <button class="page-link" (click)="prevPage()">Prev</button>
        </li>
  
        <li
          class="page-item"
          *ngFor="let p of visiblePages"
          [class.active]="p === page"
        >
          <button class="page-link" (click)="goToPage(p)">{{ p }}</button>
        </li>
  
        <li class="page-item" [class.disabled]="page === totalPages">
          <button class="page-link" (click)="nextPage()">Next</button>
        </li>
      </ul>
    </nav>
  </div>
