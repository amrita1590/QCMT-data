<div class="card shadow-sm">
  <div class="card-header fw-bold">Compliance Submission</div>
  <div class="card-body" *ngIf="audit as selectedAudit; else noAudit">
    <div class="mb-3">
      <label class="form-label fw-semibold">Select Observation</label>
      <select class="form-select" [ngModel]="selectedObservationId" (ngModelChange)="observationSelected.emit($event)">
        <option *ngFor="let observation of selectedAudit.observations" [ngValue]="observation.id">
          {{ observation.slNo }} - {{ observation.observation }} - {{ observation.status }}
        </option>
      </select>
    </div>
    <form [formGroup]="complianceForm" (ngSubmit)="submitCompliance.emit()" *ngIf="selectedObservation as observation">
      <div class="alert alert-light border">
        <strong>Observation {{ observation.slNo }}:</strong> {{ observation.observation }}
      </div>
      <label class="form-label fw-semibold">Compliance Details</label>
      <textarea class="form-control mb-3" rows="4" formControlName="complianceDetails"></textarea>
      <label class="form-label fw-semibold">Compliance Status</label>
      <select class="form-select mb-3" formControlName="status">
        <option>Pending</option>
        <option>Compliant</option>
        <option>Non-Compliant</option>
        <option>Dropped</option>
      </select>
      <button class="btn btn-secondary" type="submit" [disabled]="complianceForm.invalid">Submit Compliance</button>
    </form>
  </div>
</div>

<ng-template #noAudit>
  <div class="card-body text-muted">Select an audit to submit compliance.</div>
</ng-template>
