<div class="card shadow-sm">
  <div class="card-header fw-bold">Audit Report Submission</div>
  <div class="card-body">
    <form [formGroup]="reportForm" (ngSubmit)="submitReport.emit()">
      <div class="row g-3">
        <div class="col-md-6">
          <label class="form-label fw-semibold">Auditor Remarks</label>
          <textarea class="form-control" rows="3" formControlName="auditorRemarks"></textarea>
        </div>
        <div class="col-md-6">
          <label class="form-label fw-semibold">Final Audit Report / Supporting Files</label>
          <input type="file" multiple class="form-control" (change)="reportFilesSelected.emit($event)">
        </div>
      </div>
      <div class="d-flex justify-content-end mt-3">
        <button class="btn btn-dark" type="submit" [disabled]="reportForm.invalid || !audit">Submit Report</button>
      </div>
    </form>
  </div>
</div>
