<div class="container-fluid mt-3">

  <div class="card shadow-sm mb-3">
    <div class="card-body d-flex flex-wrap justify-content-between align-items-center gap-2">
      <div>
        <h4 class="mb-0">Internal Audit Management</h4>
        <small class="text-muted">Schedule, questionnaire, report, observation and compliance tracking</small>
      </div>
      <span class="badge bg-primary">Quality Control & Compliance</span>
    </div>
  </div>

  <div class="alert alert-success" *ngIf="internalAuditFacade.status">
    {{ internalAuditFacade.statusMsg }}
  </div>

  <div class="row g-3 mb-3">
    <div class="col-md" *ngFor="let card of internalAuditFacade.stageCards">
      <div class="card status-card h-100" [ngClass]="card.border">
        <div class="card-body py-3">
          <small class="text-muted">{{ card.label }}</small>
          <h3 class="mb-0">{{ internalAuditFacade.countByStatus(card.status) }}</h3>
        </div>
      </div>
    </div>
  </div>

  <ul class="nav nav-tabs mb-3">
    <li class="nav-item" *ngFor="let tab of internalAuditFacade.tabs">
      <button type="button"
        class="nav-link"
        [class.active]="internalAuditFacade.activeTab === tab[0]"
        (click)="internalAuditFacade.setTab(tab[0])">
        {{ tab[1] }}
      </button>
    </li>
  </ul>

  <div class="row g-3">
    <div class="col-lg-4">
      <div class="card shadow-sm h-100">
        <div class="card-header fw-bold">Internal Audit List</div>
        <div class="card-body">
          <div class="row g-2 mb-3">
            <div class="col-12">
              <input class="form-control"
                placeholder="Search ref / unit / auditor"
                [(ngModel)]="internalAuditFacade.searchText">
            </div>
            <div class="col-12">
              <select class="form-select" [(ngModel)]="internalAuditFacade.selectedStatus">
                <option value="">All Status</option>
                <option>Planned</option>
                <option>In Progress</option>
                <option>Completed</option>
                <option>Action Required</option>
                <option>Closed</option>
              </select>
            </div>
          </div>

          <button type="button"
            class="audit-list-item"
            *ngFor="let audit of internalAuditFacade.filteredAudits"
            [class.active]="internalAuditFacade.selectedAuditId === audit.id"
            (click)="internalAuditFacade.selectAudit(audit)">
            <span class="fw-semibold">{{ audit.auditRefNo }}</span>
            <small>{{ audit.unit.unitName }}</small>
            <span class="badge mt-2" [ngClass]="internalAuditFacade.statusBadge[audit.status]">
              {{ audit.status }}
            </span>
          </button>

          <div class="text-muted text-center border rounded p-3" *ngIf="internalAuditFacade.filteredAudits.length === 0">
            No internal audit found.
          </div>
        </div>
      </div>
    </div>

    <div class="col-lg-8">
      <app-internal-audit-schedule
        *ngIf="internalAuditFacade.activeTab === 'schedule'"
        [auditForm]="internalAuditFacade.auditForm"
        [units]="internalAuditFacade.units"
        (saveAudit)="internalAuditFacade.saveAudit()">
      </app-internal-audit-schedule>

      <app-internal-audit-questionnaire
        *ngIf="internalAuditFacade.activeTab === 'questionnaire'"
        [audit]="internalAuditFacade.selectedAudit"
        [questionnaireForm]="internalAuditFacade.questionnaireForm"
        (saveQuestionnaire)="internalAuditFacade.saveQuestionnaire()">
      </app-internal-audit-questionnaire>

      <app-internal-audit-unit-response
        *ngIf="internalAuditFacade.activeTab === 'response'"
        [audit]="internalAuditFacade.selectedAudit"
        [responseForm]="internalAuditFacade.responseForm"
        (submitResponse)="internalAuditFacade.submitUnitResponse()">
      </app-internal-audit-unit-response>

      <app-internal-audit-report
        *ngIf="internalAuditFacade.activeTab === 'report'"
        [audit]="internalAuditFacade.selectedAudit"
        [reportForm]="internalAuditFacade.reportForm"
        (reportFilesSelected)="internalAuditFacade.onReportFilesSelected($event)"
        (submitReport)="internalAuditFacade.submitReport()">
      </app-internal-audit-report>

      <app-internal-audit-observation
        *ngIf="internalAuditFacade.activeTab === 'observation'"
        [audit]="internalAuditFacade.selectedAudit"
        [observationForm]="internalAuditFacade.observationForm"
        (saveObservations)="internalAuditFacade.saveObservations()">
      </app-internal-audit-observation>

      <app-internal-audit-compliance
        *ngIf="internalAuditFacade.activeTab === 'compliance'"
        [audit]="internalAuditFacade.selectedAudit"
        [selectedObservation]="internalAuditFacade.selectedObservation"
        [selectedObservationId]="internalAuditFacade.selectedObservationId"
        [complianceForm]="internalAuditFacade.complianceForm"
        (observationSelected)="internalAuditFacade.selectObservation($event)"
        (submitCompliance)="internalAuditFacade.submitCompliance()">
      </app-internal-audit-compliance>

      <app-internal-audit-summary
        *ngIf="internalAuditFacade.activeTab === 'summary'"
        [audit]="internalAuditFacade.selectedAudit"
        [statusBadge]="internalAuditFacade.statusBadge">
      </app-internal-audit-summary>
    </div>
  </div>
</div>
