<div class="card shadow-sm">
  <div class="card-header fw-bold">Observation Creation</div>
  <div class="card-body">
    <form [formGroup]="observationForm" (ngSubmit)="saveObservations.emit()">
      <div class="d-flex justify-content-between align-items-center mb-2">
        <h6 class="mb-0">Observation Rows</h6>
        <button type="button" class="btn btn-outline-primary btn-sm" (click)="addObservation()">+ Add Row</button>
      </div>
      <div class="table-responsive">
        <table class="table table-bordered align-middle internal-observation-table">
          <thead class="table-light">
            <tr>
              <th>Sl No</th>
              <th>Observation</th>
              <th>Remarks, if any</th>
              <th>Type</th>
              <th>Status</th>
              <th>Action</th>
            </tr>
          </thead>
          <tbody formArrayName="observations">
            <tr *ngFor="let observation of observations.controls; let i = index" [formGroupName]="i">
              <td class="slno-cell"><input type="number" class="form-control" formControlName="slNo"></td>
              <td><textarea class="form-control" rows="2" formControlName="observation"></textarea></td>
              <td><textarea class="form-control" rows="2" formControlName="remarks"></textarea></td>
              <td>
                <select class="form-select" formControlName="type">
                  <option *ngFor="let type of observationTypes">{{ type }}</option>
                </select>
              </td>
              <td>
                <select class="form-select" formControlName="status">
                  <option *ngFor="let status of observationStatuses">{{ status }}</option>
                </select>
              </td>
              <td><button type="button" class="btn btn-outline-danger btn-sm" (click)="removeObservation(i)">Remove</button></td>
            </tr>
          </tbody>
        </table>
      </div>
      <div class="d-flex justify-content-end">
        <button class="btn btn-danger" type="submit" [disabled]="observationForm.invalid || !audit">Save Observations</button>
      </div>
    </form>
  </div>
</div>
