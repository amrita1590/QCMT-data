<div class="card shadow-sm">
  <div class="card-header fw-bold">Schedule Internal Audit</div>
  <div class="card-body">
    <form [formGroup]="auditForm" (ngSubmit)="saveAudit.emit()">
      <div class="row g-3">
        <div class="col-md-4">
          <label class="form-label fw-semibold">Audit Reference No.</label>
          <input class="form-control" formControlName="auditRefNo">
        </div>
        <div class="col-md-4">
          <label class="form-label fw-semibold">Audit Type</label>
          <select class="form-select" formControlName="auditType">
            <option>IG Audit</option>
            <option>Zonal DIG Audit</option>
            <option>Sector Audit</option>
            <option>Unit Internal Audit</option>
          </select>
        </div>
        <div class="col-md-4">
          <label class="form-label fw-semibold">Unit / ASG</label>
          <select class="form-select" formControlName="unitId">
            <option value="">- Select Unit -</option>
            <option *ngFor="let unit of units" [value]="unit.id">{{ unit.unitName }}</option>
          </select>
        </div>
        <div class="col-md-3">
          <label class="form-label fw-semibold">Audit From Date</label>
          <input type="date" class="form-control" formControlName="auditFromDate">
        </div>
        <div class="col-md-3">
          <label class="form-label fw-semibold">Audit To Date</label>
          <input type="date" class="form-control" formControlName="auditToDate">
        </div>
        <div class="col-md-3">
          <label class="form-label fw-semibold">Auditor Rank</label>
          <input class="form-control" formControlName="auditorRank">
        </div>
        <div class="col-md-3">
          <label class="form-label fw-semibold">Auditor Name</label>
          <input class="form-control" formControlName="auditorName">
        </div>
        <div class="col-md-4">
          <label class="form-label fw-semibold">Status</label>
          <select class="form-select" formControlName="status">
            <option>Planned</option>
            <option>In Progress</option>
            <option>Completed</option>
            <option>Action Required</option>
          </select>
        </div>
      </div>
      <div class="d-flex justify-content-end mt-3">
        <button type="submit" class="btn btn-primary" [disabled]="auditForm.invalid">Save Audit Schedule</button>
      </div>
    </form>
  </div>
</div>
