<app-toast></app-toast>
@if (shouldShowHeader()) {
    <app-header></app-header>
    <router-outlet></router-outlet>
                    
} @else {
    <app-left-sidebar
    [isLeftSidebarCollapsed]="isLeftSidebarCollapsed()"
    (changeIsLeftSidebarCollapsed)="changeIsLeftSidebarCollapsed($event)"
    />

    <app-main
    [isLeftSidebarCollapsed]="isLeftSidebarCollapsed()"
    [screenWidth]="screenWidth()"
    />
}
<app-footer
    [class.with-sidebar]="!shouldShowHeader()"
    [class.with-expanded-sidebar]="!shouldShowHeader() && !isLeftSidebarCollapsed() && screenWidth() > 768"
></app-footer>
