<div class="container-fluid mt-3">

  <!-- HEADER -->
  <div class="card shadow-sm mb-3">
    <div class="card-body d-flex justify-content-between align-items-center">
      <h4 class="mb-0">ICAO Audit Management</h4>
      <span class="badge bg-success">Quality Control & Compliance</span>
    </div>
  </div>

  <!-- TABS -->
  <ul class="nav nav-tabs mb-3">
    <li class="nav-item" *ngFor="let tab of [
      ['schedule','Audit Schedule'],
      ['auditor','Auditor Master'],
      ['category','Question Categories'],
      ['questionnaire','Questionnaire'],
      ['observation','Observations'],
      ['compliance','Compliance']
    ]">
      <a class="nav-link"
         [class.active]="activeTab === tab[0]"
         (click)="setTab(tab[0])">
        {{tab[1]}}
      </a>
    </li>
  </ul>

  <!-- AUDIT SCHEDULE -->
  <div *ngIf="activeTab==='schedule'" class="card shadow-sm">
    <div class="card-header fw-bold">Manage and track all audit schedules</div>
    <div class="card-body">
      <div class="page-container">  </div></div></div></div>
