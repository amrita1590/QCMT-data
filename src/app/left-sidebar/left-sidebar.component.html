<div
  class="sidenav d-flex flex-column justify-between"
  [ngClass]="isLeftSidebarCollapsed() ? 'sidenav-collapsed' : ''"
>
  <!-- Logo -->
  <div class="logo-container">
    <button type="button" class="logo" (click)="toggleCollapse()" aria-label="Toggle navigation menu" title="Toggle menu">
      <i class="fas fa-bars"></i>
    </button>
    @if (!isLeftSidebarCollapsed()) {
      <div class="logo-text" aria-label="CISF e-SamikSha">
        <img class="cisf-emblem" src="images/cisf-logo.png" alt="CISF">
        <span class="brand-divider" aria-hidden="true"></span>
        <img class="esamiksha-logo" src="images/logo3.png" alt="e-SamikSha">
      </div>
      <button type="button" class="sidebar-close" (click)="closeSidenav()" aria-label="Collapse navigation menu" title="Collapse menu">
        <i class="fas fa-times" aria-hidden="true"></i>
      </button>
    }
  </div>

  <!-- Nav -->
  <div class="sidenav-nav flex-grow-1">
  <li *ngFor="let item of permissions; let i = index" class="sidenav-nav-item">
    <a
      class="sidenav-nav-link"
      [routerLink]="item.permissionRoutelink"
      routerLinkActive="active"
      [routerLinkActiveOptions]="{ exact: true }"
    >
      <i class="sidenav-link-icon" [class]="item.permissionIcon"></i>
      <span class="sidenav-link-text" *ngIf="!isLeftSidebarCollapsed()">
        {{ item.permissionLabel }}
      </span>
    </a>
  </li>
  <li *ngIf="showZoneBoardLink" class="sidenav-nav-item">
    <a class="sidenav-nav-link" routerLink="/zoneboard" routerLinkActive="active">
      <i class="sidenav-link-icon fas fa-map-marked-alt"></i>
      <span class="sidenav-link-text" *ngIf="!isLeftSidebarCollapsed()">Zone Board</span>
    </a>
  </li>
  <li *ngIf="showSectorBoardLink" class="sidenav-nav-item">
    <a class="sidenav-nav-link" routerLink="/sectorboard" routerLinkActive="active">
      <i class="sidenav-link-icon fas fa-layer-group"></i>
      <span class="sidenav-link-text" *ngIf="!isLeftSidebarCollapsed()">Sector Board</span>
    </a>
  </li>
  <li *ngIf="showCalendarManagerLink" class="sidenav-nav-item">
    <a class="sidenav-nav-link" routerLink="/iqcucalendar" routerLinkActive="active">
      <i class="sidenav-link-icon fas fa-calendar-days"></i>
      <span class="sidenav-link-text" *ngIf="!isLeftSidebarCollapsed()">IQCU Calendar</span>
    </a>
  </li>
</div>

  <!-- Profile Section -->
  <div class="sidenav-profile">
    <div class="profile-info" *ngIf="!isLeftSidebarCollapsed()">
      <i class="fas fa-user-circle profile-icon"></i>
      <span class="profile-name">{{ usernameData }}</span>
    </div>
    <button class="logout-btn" (click)="logout()">
      <i class="fas fa-sign-out-alt"></i>
      <span *ngIf="!isLeftSidebarCollapsed()">Logout</span>
    </button>
  </div>
</div>
